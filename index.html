const slotEls=[0,1,2,3].map(i=>$('#s'+i)), fuseEl=$('#fuse'), abilEl=$('#abil'), pauseEl=$('#pause');
let barSig='';
function updateBar(force){
  if(!g) return;
  const m=morph();
  const sig=g.inv.map(it=>it?(it.k+(it.type||it.name||'')):'-').join('|')+fuseOpen()+m+Math.ceil(g.abilCd*10)+(g.fx.jam>0);
  if(!force&&sig===barSig) return; barSig=sig;
  g.inv.forEach((it,i)=>{
    const el=slotEls[i];
    if(!it){ el.className='slot empty'; el.style.background=''; el.style.color=''; el.innerHTML=`<span class="k">${i+1}</span>empty`; return; }
    el.className='slot';
    if(it.k==='p'){ const P=POWERS[it.type]; el.style.background=P.color; el.style.color='#10121f'; el.innerHTML=`<span class="k">${i+1}</span>${P.label}`; }
    else if(it.k==='f'){ el.style.background=`linear-gradient(135deg,${POWERS[it.a].color},${POWERS[it.b].color})`; el.style.color='#10121f'; el.innerHTML=`<span class="k">${i+1}</span><span style="font-size:9px">${esc(it.name)}</span><small>FUSED</small>`; }
    else { el.style.background='linear-gradient(135deg,#fff3b0,#ffb800)'; el.style.color='#3a2600'; el.innerHTML=`<span class="k">${i+1}</span>SUPER<small>ULTIMATE</small>`; }
  });
  slotEls.forEach(el=>{ el.style.opacity=g.fx.jam>0?'.35':''; });
  fuseEl.disabled=false; fuseEl.innerHTML=fuseOpen()?'FUSE<small>F</small>':'FUSE<small>LV 5</small>'; fuseEl.style.opacity=fuseOpen()?'':'.5';
  if(m){ const M=MORPHS[m]; abilEl.style.setProperty('--mc',M.c[1]); abilEl.style.color='#10121f'; abilEl.style.setProperty('--cd',g.abilCd/M.cd); abilEl.innerHTML=`${M.name.toUpperCase()}<small>${g.abilCd>0?Math.ceil(g.abilCd)+'s':'READY · Q'}</small>`; }
  else { abilEl.style.removeProperty('--mc'); abilEl.style.color=''; abilEl.style.setProperty('--cd',0); abilEl.innerHTML=`MORPH<small>${morphOpen()?'EQUIP':'LV 11'}</small>`; abilEl.style.opacity=morphOpen()?'':'.5'; }
}
slotEls.forEach((el,i)=>el.addEventListener('click',()=>useSlot(i)));
fuseEl.addEventListener('click',fuse); abilEl.addEventListener('click',useAbility);
pauseEl.addEventListener('click',()=>{ if(state==='play') pauseGame(); else if(state==='pause') resume(); });

// =====================================================================
//  SCREENS
// =====================================================================
function setScreen(s,html=''){
  state=s; overlay.innerHTML=html;
  const showBar = (s==='play'||s==='pause');
  if(bar.hidden===showBar){ bar.hidden=!showBar; resize(); }
  if(showBar) updateBar(true);
  const first=overlay.querySelector('button.big')||overlay.querySelector('button'); if(first && matchMedia('(pointer:fine)').matches) first.focus({preventScroll:true});
}
function titleScreen(){
  g=null;
  const cont=save.maxLevel>1;
  setScreen('title',`<div class="screen">
    <div class="logo">${esc(GAME_NAME.toUpperCase())}<small>A SMALL BLOCK'S LONG WAY HOME</small></div>
    <p class="tag">Kicked out of Super Block World for being too small. Bounce back the balls they throw at you, break your way home, and grow.</p>
    <div class="btns">
      <button class="big" data-act="play">${cont?`Continue · Level ${save.maxLevel}`:'Start the journey'}</button>
      <div class="row"><button data-act="map">Map</button><button data-act="lab">Morph Lab</button></div>
      <div class="row"><button data-act="howto">How to play</button><button data-act="powers">Power list</button></div>
    </div>
    <div class="row" style="gap:calc(var(--u)*4)">${HOME_URL?`<a class="ghost" href="${esc(HOME_URL)}">‹ All games</a>`:''}<button class="ghost" data-act="watchstory">Story</button><button class="ghost" data-act="sound">Sound: ${save.sound?'on':'off'}</button></div>
    <div style="height:calc(var(--u)*120)"></div>
  </div>`);
}
function storyScreen(i=0){
  story={i,t:0,parts:[],fired:{},blocks:[]};
  const last=i===STORY_SCENES.length-1;
  setScreen('story',`<div class="screen story-screen">
    <div class="cap" aria-live="polite"><span class="eyebrow">${i+1} / ${STORY_SCENES.length}</span><p class="story">${STORY_SCENES[i].text}</p></div>
    <div class="row story-nav"><button class="ghost" data-act="skipstory">Skip</button><button class="big" data-act="story">${last?"Let's go":'Next'}</button></div>
  </div>`);
}
function nextStory(){ if(story.i+1<STORY_SCENES.length) storyScreen(story.i+1); else endStory(); }
function endStory(){ save.seenStory=true; persist(); startLevel(save.maxLevel); }
function mapScreen(){
  g=null;
  const maxW=worldOf(save.maxLevel);
  mapWorld=clamp(mapWorld,0,maxW);
  const w=worldInfo(mapWorld), first=mapWorld*10+1;
  let nodes='';
  for(let i=0;i<10;i++){
    const L=first+i, boss=L%10===0, locked=L>save.maxLevel, done=L<save.maxLevel, cur=L===save.maxLevel;
    const ms=save.missions[L]||[0,0];
    nodes+=`<button class="node${boss?' boss':''}${done?' done':''}${cur?' cur':''}" data-act="lvl" data-l="${L}" ${locked?'disabled':''} aria-label="Level ${L}${boss?' boss':''}">
      ${boss?`<small>BOSS</small>`:''}${L}${done||cur?`<span class="pp"><i class="${ms[0]?'on':''}"></i><i class="${ms[1]?'on':''}"></i></span>`:''}</button>`;
  }
  const m=morph();
  setScreen('map',`<div class="screen">
    <div class="topbar"><button class="ghost" data-act="title">‹ Title</button><span class="shards">◆ ${save.shards}</span></div>
    <div class="worldnav">
      <button data-act="wprev" ${mapWorld<=0?'disabled':''} aria-label="Previous world">‹</button>
      <div><span class="eyebrow">World ${mapWorld+1} · Levels ${first}–${first+9}</span><h2>${esc(w.name)}</h2></div>
      <button data-act="wnext" ${mapWorld>=maxW?'disabled':''} aria-label="Next world">›</button>
    </div>
    <div class="nodes">${nodes}</div>
    <p class="tag" style="font-size:calc(var(--u)*13);color:var(--muted)">Boss: <b style="color:var(--ink)">${esc(w.boss)}</b> · You are a ${m?`<b style="color:var(--ink)">${MORPHS[m].name}</b> morph`:`<b style="color:var(--ink)">${SIZES[sizeStage()-1]}</b> (size ${sizeStage()}/10)`}</p>
    <div class="row" style="max-width:calc(var(--u)*340)"><button data-act="lab">Morph Lab</button><button class="big" data-act="lvl" data-l="${save.maxLevel}">Play ${save.maxLevel}</button></div>
    <div style="height:calc(var(--u)*110)"></div>
  </div>`);
}
function labScreen(){
  g=null;
  const open=morphOpen();
  let cards='';
  for(const [k,M] of Object.entries(MORPHS)){
    const owned=!!save.morphs[k], eq=save.equipped===k;
    let btn;
    if(!open) btn=`<button disabled>Locked</button>`;
    else if(eq) btn=`<button class="big" data-act="unequip" data-k="${k}">Equipped</button>`;
    else if(owned) btn=`<button data-act="equip" data-k="${k}">Equip</button>`;
    else btn=`<button class="gold" data-act="buy" data-k="${k}" ${save.shards<M.cost?'disabled':''}>Unlock ◆ ${M.cost}</button>`;
    cards+=`<div class="morph${eq?' eq':''}"><div class="sw" style="background:linear-gradient(${M.c[0]},${M.c[1]})"></div><h4>${M.name}</h4><p><b>Passive.</b> ${M.passive}</p><p><b>Active.</b> ${M.active} <span style="white-space:nowrap">(${M.cd}s)</span></p>${btn}</div>`;
  }
  const chip=k=>`<span class="chip" style="background:${POWERS[k].color}">${POWERS[k].label}</span>`;
  let rec=Object.entries(RECIPES).map(([k,R])=>{ const [a,b]=k.split('+'); return `<div>${chip(a)}+${chip(b)}<b>= ${R.name}</b><em>${R.desc}</em></div>`; }).join('');
  rec+=`<div><b>${OVERDRIVE.name}</b><em>${OVERDRIVE.desc}</em></div>`;
  rec+=`<div><span class="chip" style="background:#fff">FUSED</span>+<span class="chip" style="background:#fff">FUSED</span><b>= SUPER BLOCK</b><em>Ultimate. 12s of giant size, a wall, fire, lasers and 6 fireballs. Breaks steel. Opens after the Level 10 boss.</em></div>`;
  setScreen('lab',`<div class="screen scroll dim">
    <div class="row" style="justify-content:space-between"><button class="ghost" data-act="back">‹ Back</button><span class="shards" style="align-self:center">◆ ${save.shards}</span></div>
    <h2>Morph Lab</h2>
    <p class="tag" style="font-size:calc(var(--u)*13);color:var(--muted)">${open?'Each morph changes how you play: one passive that is always on, one active you trigger with MORPH. Earn ◆ shards from missions and bosses.':'You grow until Monolith size at Level 10. Beat the Level 10 boss to stop growing and start morphing. Shards you earn from missions now will be waiting.'}</p>
    <div class="mgrid">${cards}</div>
    <h3>Fusion recipes</h3>
    <p class="tag" style="font-size:calc(var(--u)*12.5);color:var(--muted)">Store two power-ups, then tap FUSE. Opens at Level 5.</p>
    <div class="recipes">${rec}</div>
    <div style="height:calc(var(--u)*10)"></div>
  </div>`);
}
function howtoScreen(){
  setScreen('howto',`<div class="screen scroll dim">
    <div class="row" style="justify-content:flex-start"><button class="ghost" data-act="back">‹ Back</button></div>
    <h2>How to play</h2>
    <div class="howto card">
      <p><b>Move</b> by dragging or moving the mouse anywhere on the field, or with <kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd>.</p>
      <p><b>Red spiky balls</b> are thrown at you. Touch one and it becomes yours. If one gets past you, you lose a heart.</p>
      <p><b>Your balls</b> break blocks. Clear every block (steel does not count) to finish the level and grow one size.</p>
      <p><b>Power-ups</b> drop from glowing blocks. Catching one stores it in a slot. Use it with <kbd>1</kbd>–<kbd>4</kbd> or tap the slot. If your slots are full it fires straight away.</p>
      <p><b>Power-downs</b> come in dark capsules with a ▼. Dodge them. +HP clears them.</p>
      <p><b>Fuse</b> two stored power-ups into a stronger one with <kbd>F</kbd>. Fuse two fusions into the <b>SUPER BLOCK</b> ultimate.</p>
      <p><b>Morph</b> after Level 10. Your form's active ability is on <kbd>Q</kbd> or <kbd>Space</kbd>.</p>
      <p><b>Missions</b>: each level has two. Finish them for ◆ shards to unlock morphs.</p>
      <p>Pause with <kbd>P</kbd> or <kbd>Esc</kbd>.</p>
    </div>
  </div>`);
}
let backTo='title';
function powersScreen(){
  const pu=Object.values(POWERS).map(P=>`<li><span class="chip" style="background:${P.color}">${P.label}</span><span class="pd">${P.desc}</span><span class="r">Lv ${P.from}</span></li>`).join('');
  const pd=Object.values(CURSES).map(C=>`<li><span class="chip curse" style="color:${C.color};border-color:${C.color}">▼ ${C.label}</span><span class="pd">${C.desc}</span><span class="r">Lv ${C.from}</span></li>`).join('');
  setScreen('powers',`<div class="screen scroll dim">
    <div class="row" style="justify-content:flex-start"><button class="ghost" data-act="back">‹ Back</button></div>
    <h2>Power list</h2>
    <h3>Power-ups · catch these</h3>
    <p class="note">Bright capsules from glowing blocks. They go into your 4 slots so you can use them when you want.</p>
    <ul class="list plist">${pu}</ul>
    <h3 style="color:var(--hot)">Power-downs · dodge these</h3>
    <p class="note">Dark capsules from blocks marked with a ▼, and from bosses after World 2. They hit you the moment you touch them. +HP clears them all, and SUPER BLOCK makes you immune.</p>
    <ul class="list plist">${pd}</ul>
    <h3>Combine them</h3>
    <p class="note">From Level 5, fuse two stored power-ups into a stronger one (recipes are in the Morph Lab). After the Level 10 boss, fuse two fusions into the SUPER BLOCK ultimate.</p>
    <div style="height:calc(var(--u)*10)"></div>
  </div>`);
}
function pauseGame(){ if(state==='play') showPause(); }
function showPause(){
  setScreen('pause',`<div class="screen dim">
    <span class="eyebrow">Level ${g.L} · ${esc(g.world.name)}</span><h2>Paused</h2>
    <ul class="list">${g.missions.map(([k,n])=>`<li><span class="pip ${MISSIONS[k].check(g,n)?'on':''}"></span>${MISSIONS[k].text(n)}</li>`).join('')}</ul>
    <div class="btns"><button class="big" data-act="resume">Resume</button><div class="row"><button data-act="retry">Restart</button><button data-act="map">Map</button></div>
    <button data-act="powers">Power list</button>
    <button class="ghost" data-act="sound">Sound: ${save.sound?'on':'off'}</button></div>
  </div>`);
}
function resume(){ if(state==='pause'){ setScreen('play'); } }
function gameOver(){
  setScreen('over',`<div class="screen dim">
    <span class="eyebrow">Level ${g.L} · ${esc(g.world.name)}</span><h2 style="color:var(--hot)">Squashed</h2>
    <p class="tag">${esc(pickTip())}</p>
    <div id="rewardBox" class="reward" hidden></div>
    <div class="btns"><button class="big" data-act="retry">Try again</button><button data-act="map">Map</button></div>
  </div>`);
  offerContinue();
}
const TIPS=['Hit a ball with the edge of your block to send it sideways.','Save a WALL for when things get busy. It turns every ball at the floor into yours.','Cannons keep firing until you break them.','Bombs are worth aiming for: they clear their neighbours.','Fusing two power-ups is stronger than using both.','You do not need to break steel blocks to clear a level.'];
const pickTip=()=>TIPS[(Math.random()*TIPS.length)|0];

function finishLevel(){
  const L=g.L, prevSize=sizeStage(), first=L===save.maxLevel;
  if(first) save.maxLevel=L+1;
  const newSize=sizeStage();
  const prev=save.missions[L]||[0,0];
  const res=g.missions.map(([k,n],i)=>{ const ok=MISSIONS[k].check(g,n); return {text:MISSIONS[k].text(n), ok, gain:ok&&!prev[i]?1:0}; });
  save.missions[L]=res.map((r,i)=>(r.ok||prev[i])?1:0);
  let shards=res.reduce((s,r)=>s+r.gain,0);
  const unlocks=[];
  if(g.boss&&first){ shards+=5; unlocks.push(`<b>+5 ◆</b> for beating ${esc(g.boss.name)}.`); }
  if(L===10&&first){ save.morphs.spike=true; save.equipped='spike'; unlocks.push(`<b>MORPHING UNLOCKED.</b> You are fully grown, so now you change shape. You start as <b>Spike</b>. Unlock more in the Morph Lab.`); unlocks.push(`<b>ULTIMATE UNLOCKED.</b> Fuse two fusions into SUPER BLOCK.`); }
  if(L===4&&first) unlocks.push(`<b>FUSION UNLOCKED.</b> Tap FUSE to merge two stored power-ups.`);
  if(L%10===0&&first&&L<100) unlocks.push(`<b>NEW WORLD:</b> ${esc(worldInfo(L/10).name)}.`);
  save.shards+=shards; save.best[L]=Math.max(save.best[L]||0,g.score); persist();
  const grew=newSize>prevSize;
  const px=n=>`calc(var(--u)*${(baseW(n)*.55).toFixed(1)})`, py=n=>`calc(var(--u)*${((16+n*1.6)*.9).toFixed(1)})`;
  const growHtml = grew ? `<div class="grow"><div class="hb" style="width:${px(prevSize)};height:${py(prevSize)};opacity:.6"></div><span class="arrow">›</span><div class="hb" style="width:${px(newSize)};height:${py(newSize)}"></div></div>
     <p class="tag"><b>You grew!</b> ${SIZES[prevSize-1]} → <b style="color:var(--mint)">${SIZES[newSize-1]}</b>${newSize===10?'. Fully grown.':''}</p>` : '';
  setScreen('clear',`<div class="screen dim">
    <span class="eyebrow">World ${g.world.idx+1} · Level ${L}</span>
    <h2 style="color:var(--mint)">${g.boss?'Boss down!':'Level clear'}</h2>
    ${growHtml}
    <div class="stats"><div><span>Score</span><b>${g.score}</b></div><div><span>Best combo</span><b>×${g.maxCombo}</b></div><div><span>Time</span><b>${Math.round(g.time)}s</b></div></div>
    <ul class="list">${res.map(r=>`<li><span class="pip ${r.ok?'on':''}"></span>${r.text}<span class="r">${r.gain?'+1 ◆':r.ok?'done':''}</span></li>`).join('')}</ul>
    ${unlocks.map(u=>`<div class="unlock">${u}</div>`).join('')}
    <div id="rewardBox" class="reward" hidden></div>
    <div class="row"><button data-act="map">Map</button><button data-act="retry">Replay</button><button class="big" data-act="next">Next ›</button></div>
  </div>`);
  rewardWatched=false; offerClearReward(shards);
}

overlay.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(!b){ if(state==='story'&&!e.target.closest('a')){ initAudio(); nextStory(); } return; }
  initAudio(); sfx('click');
  const a=b.dataset.act;
  switch(a){
    case 'play': if(!save.seenStory){ storyScreen(0); } else startLevel(save.maxLevel); break;
    case 'story': nextStory(); break;
    case 'skipstory': endStory(); break;
    case 'watchstory': storyScreen(0); break;
    case 'map': mapWorld=worldOf(save.maxLevel); mapScreen(); break;
    case 'lab': backTo=state==='map'?'map':'title'; labScreen(); break;
    case 'howto': backTo='title'; howtoScreen(); break;
    case 'powers': backTo=state==='pause'?'pause':state==='map'?'map':'title'; powersScreen(); break;
    case 'back': backTo==='pause'?showPause():backTo==='map'?mapScreen():titleScreen(); break;
    case 'title': titleScreen(); break;
    case 'wprev': mapWorld--; mapScreen(); break;
    case 'wnext': mapWorld++; mapScreen(); break;
    case 'lvl': startLevel(+b.dataset.l); break;
    case 'resume': resume(); break;
    case 'retry': startLevel(g.L); break;
    case 'next': goNext(g.L+1); break;
    case 'sound': save.sound=!save.sound; persist(); b.textContent=`Sound: ${save.sound?'on':'off'}`; adSound(); break;
    case 'equip': save.equipped=b.dataset.k; persist(); labScreen(); break;
    case 'unequip': save.equipped=null; persist(); labScreen(); break;
    case 'buy': { const k=b.dataset.k, M=MORPHS[k]; if(save.shards>=M.cost){ save.shards-=M.cost; save.morphs[k]=true; save.equipped=k; persist(); sfx('fuse'); labScreen(); } break; }
  }
});

// =====================================================================
//  INPUT
// =====================================================================
function pointerX(e){ const r=cv.getBoundingClientRect(); return (e.clientX-r.left)/r.width*W; }
const ptrTarget=e=>{ const x=pointerX(e); return g&&g.fx.flip>0?W-x:x; };
function skipIntro(){ if(state==='play'&&g&&g.intro>0){ const e=INTRO-g.intro; if(e>.3&&e<2.3) g.intro=INTRO-2.3; } }
cv.addEventListener('pointerdown',e=>{ initAudio(); if(g){ skipIntro(); g.p.tx=ptrTarget(e); } cv.setPointerCapture?.(e.pointerId); });
cv.addEventListener('pointermove',e=>{ if(g&&state==='play') g.p.tx=ptrTarget(e); });
addEventListener('keydown',e=>{
  initAudio();
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a') keys.left=true;
  if(k==='arrowright'||k==='d') keys.right=true;
  if(state==='play'){
    if(k===' '||k==='enter') skipIntro();
    if(k>='1'&&k<='4') useSlot(+k-1);
    else if(k==='f') fuse();
    else if(k==='q'||k===' '){ e.preventDefault(); useAbility(); }
    else if(k==='p'||k==='escape') pauseGame();
  } else if(state==='pause' && (k==='p'||k==='escape')) resume();
});
addEventListener('keyup',e=>{ const k=e.key.toLowerCase(); if(k==='arrowleft'||k==='a') keys.left=false; if(k==='arrowright'||k==='d') keys.right=false; });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state==='play') pauseGame(); });
addEventListener('blur',()=>{ keys.left=keys.right=false; });

// =====================================================================
//  LOOP
// =====================================================================
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,Math.max(0,(now-last)/1000)); last=now;
  try{ if(state==='play'&&g) update(dt); render(dt); }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
window.__blk={get g(){return g}, get save(){return save}, startLevel, buildLevel, finishLevel, setSave:o=>{Object.assign(save,o);persist();}};
resize(); titleScreen(); adSound(); requestAnimationFrame(frame);
})();
</script>
